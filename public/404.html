<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stampo</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 24px;
      background-color: #f5dc68;
      color: #1a1819;
      font-family: system-ui, sans-serif;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    p {
      margin: 0;
      max-width: 30ch;
      font-size: 16px;
      line-height: 22px;
      color: rgba(26, 24, 25, 0.7);
    }

    a.button {
      display: inline-block;
      margin-top: 8px;
      padding: 14px 32px;
      border-radius: 999px;
      background-color: #d62727;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      text-decoration: none;
    }

    a.button:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>
  <h1>Page not found</h1>
  <p>This page doesn't exist, or got lost in the mail.</p>
  <a class="button" href="/">← Back to Stampo</a>
</body>
</html>
